name: Publish Foundry release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example, v0.4.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          test "$RELEASE_TAG" = "v$version"
          test "$package_version" = "$version"

      - name: Build Foundry package
        id: package
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")"
          archive="pf1-gestalt-$version.zip"
          zip -r "$archive" module.json README.md package.json scripts styles lang
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            module.json "$ARCHIVE" \
            --title "PF1e Gestalt $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
